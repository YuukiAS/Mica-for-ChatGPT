<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="popup.css">
    <title>Mica</title>
  </head>
  <body>
    <main>
      <header class="topbar">
        <div class="brand">
          <img src="../icons/icon32.png" alt="" width="24" height="24">
          <div>
            <strong>Mica</strong>
            <span id="version">v0.2.0</span>
          </div>
        </div>
        <label class="switch" aria-label="Enable Mica">
          <input id="enabled" type="checkbox" checked>
          <span></span>
        </label>
      </header>

      <section class="status-card" aria-label="Runtime status">
        <span id="dot"></span>
        <div>
          <div id="state">Native windowed</div>
          <p id="reason">Open a ChatGPT conversation.</p>
          <small id="counts">0 mounted</small>
        </div>
      </section>

      <section class="feature-list" aria-label="Core features">
        <label class="feature-row">
          <span>
            <strong>Performance</strong>
            <small>Reduce long-thread rendering overhead</small>
          </span>
          <input id="longThreadOptimization" type="checkbox" checked>
        </label>
        <label class="feature-row">
          <span>
            <strong>Copy</strong>
            <small>Display equations as $$...$$</small>
          </span>
          <input id="micaMarkdownCopy" type="checkbox" checked>
        </label>
        <label class="feature-row">
          <span>
            <strong>Reliability</strong>
            <small>Safe interruption and composer recovery</small>
          </span>
          <input id="reliabilityEnabled" type="checkbox" checked>
        </label>
      </section>

      <section class="diagnostics" aria-label="Diagnostics">
        <div class="section-heading">
          <strong>Diagnostics</strong>
          <span id="diagnosticsStatus">Idle</span>
        </div>
        <div class="actions">
          <button id="runComposerCheck" class="primary" type="button">Run one-shot diagnostics</button>
          <button id="copyComposerReport" type="button">Copy report</button>
          <button id="stopComposerCheck" type="button">Stop</button>
          <button id="resetDiagnostics" type="button">Reset</button>
        </div>
        <p id="composerCheckStatus">Idle</p>
      </section>

      <details>
        <summary>Advanced</summary>
        <div class="advanced">
          <label class="feature-row compact">
            <span>Status dot</span>
            <input id="showStatus" type="checkbox" checked>
          </label>
          <label class="field">
            <span>Recent native turns</span>
            <input id="recentTurnKeepCount" type="number" min="4" max="20" step="1" value="8">
          </label>
          <label class="feature-row compact">
            <span>Auto-dismiss known interruptions</span>
            <input id="autoDismissKnownInterruptions" type="checkbox" checked>
          </label>
          <label class="feature-row compact">
            <span>Composer recovery</span>
            <input id="staleClearRecovery" type="checkbox" checked>
          </label>
          <label class="feature-row compact">
            <span>Connector continuity</span>
            <input id="connectorContinuity" type="checkbox" checked>
          </label>
          <label class="feature-row compact">
            <span>Send residual recovery</span>
            <input id="sendResidualRecovery" type="checkbox" checked>
          </label>
          <button id="prepareFinalSendCheck" class="wide" type="button">Prepare final send check</button>
        </div>
      </details>

      <footer id="buildLabel">v020-convergence.rc1</footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
