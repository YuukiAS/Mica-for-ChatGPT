<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="popup.css">
    <title>Mica</title>
  </head>
  <body>
    <main class="shell" data-view="popup">
      <header class="brand-header">
        <div class="brand-lockup">
          <span class="strata-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <h1>Mica</h1>
        </div>
        <label class="switch-control">
          <span class="sr-only">Enable Mica</span>
          <input id="enabled" type="checkbox" checked>
          <span class="switch-track" aria-hidden="true"></span>
        </label>
      </header>

      <section class="compatibility-line" aria-labelledby="compatibility-title" aria-live="polite" data-state="loading">
        <span class="status-rail" aria-hidden="true"><i></i><i></i><i></i></span>
        <div>
          <h2 id="compatibility-title">Checking this page…</h2>
          <p id="compatibility-detail" hidden></p>
        </div>
      </section>

      <section class="capability-list" aria-label="Mica features">
        <div class="capability-row">
          <div>
            <h2>Low memory</h2>
            <p>Will pause older messages locally without deleting history.</p>
          </div>
          <span class="capability-value muted">Unavailable in this build</span>
        </div>
        <div class="capability-row compact">
          <div><h2>Page health</h2></div>
          <span id="page-health" class="capability-value">Checking…</span>
        </div>
      </section>

      <nav class="link-list" aria-label="Support">
        <a id="troubleshooting-link" class="text-link-row" href="troubleshooting.html?from=index">
          <span>Troubleshooting</span><span aria-hidden="true">›</span>
        </a>
      </nav>

      <footer class="product-footer">
        <span id="version">Mica</span>
        <details id="advanced">
          <summary>Advanced</summary>
          <a id="developer-qa-link" href="qa.html?from=index" hidden>Open Developer QA</a>
        </details>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
