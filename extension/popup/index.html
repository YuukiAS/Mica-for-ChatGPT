<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="popup.css">
    <title>Mica</title>
  </head>
  <body>
    <main>
      <header class="product-header">
        <img src="../icons/icon32.png" width="28" height="28" alt="">
        <div class="identity">
          <h1>Mica</h1>
          <p id="pageStatus">Checking this page…</p>
        </div>
        <label class="switch" title="Turn Mica on or off">
          <input id="enabled" type="checkbox" checked aria-label="Enable Mica">
          <span aria-hidden="true"></span>
        </label>
      </header>

      <section class="capabilities" aria-label="Mica capabilities">
        <div class="capability-row">
          <div>
            <h2>Copy &amp; Export</h2>
            <p id="copyStatus">Open an answer to copy it.</p>
          </div>
          <button id="copyMarkdown" class="secondary-action" type="button" disabled>Copy Markdown</button>
        </div>

        <div class="capability-row">
          <div>
            <h2>Reliability</h2>
            <p id="reliabilityStatus">Watching for delivery issues.</p>
          </div>
        </div>

        <div class="capability-row">
          <div>
            <h2>Page integration</h2>
            <p id="integrationStatus">Native handling</p>
          </div>
        </div>
      </section>

      <details class="advanced">
        <summary>Advanced</summary>
        <label class="setting-row">
          <span><strong>Copy &amp; Export</strong><small>Enable local answer conversion.</small></span>
          <input id="copyExport" type="checkbox" checked>
        </label>
        <label class="setting-row">
          <span><strong>Reliability</strong><small>Watch sends without auto-resending.</small></span>
          <input id="reliability" type="checkbox" checked>
        </label>
        <label class="setting-row">
          <span><strong>Page integration</strong><small>Show controls only on verified structures.</small></span>
          <input id="pageIntegration" type="checkbox" checked>
        </label>
      </details>

      <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
      <footer><span>Local by default</span><span id="version">v0.3.0</span></footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
