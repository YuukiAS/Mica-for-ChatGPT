<!doctype html>
<html lang="en" data-mica-fixture="true">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mica overlay controls hit test</title>
    <style>
      body {
        min-height: 1200px;
        margin: 0;
        background: #f7f7f8;
        color: #171717;
        font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(820px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 32px 0 180px;
      }

      article {
        margin: 14px 0;
        padding: 14px;
        border: 1px solid #d9d9e3;
        border-radius: 8px;
        background: #ffffff;
      }

      .composer {
        position: fixed;
        left: 50%;
        bottom: 14px;
        z-index: 10;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        width: min(820px, calc(100vw - 24px));
        min-height: 82px;
        padding: 12px;
        border: 1px solid #cfcfd6;
        border-radius: 18px;
        background: #ffffff;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.16);
        transform: translateX(-50%);
      }

      [role="textbox"] {
        min-height: 46px;
        padding: 10px 12px;
        border: 1px solid #dddddd;
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <article data-testid="conversation-turn-1">
        <div data-message-author-role="assistant">assistant turn</div>
      </article>
    </main>
    <form class="composer" data-testid="composer" aria-label="Message composer">
      <div id="editor" role="textbox" contenteditable="plaintext-only" aria-label="Message Mica">overlay hit test draft</div>
      <button type="submit" data-testid="send-button" aria-label="Send message">Send</button>
    </form>

    <script>
      window.__MICA_CLIPBOARD_TEXT__ = "";
      Object.defineProperty(navigator, "clipboard", {
        configurable: true,
        value: {
          writeText: async (text) => {
            window.__MICA_CLIPBOARD_TEXT__ = String(text);
          }
        }
      });
    </script>
    <script src="../../dist/mica-dev/known-interruptions.js"></script>
    <script src="../../dist/mica-dev/connector-lifecycle-signal.js"></script>
    <script src="../../dist/mica-dev/composer-diagnostics.js"></script>
    <script src="../../dist/mica-dev/stale-composer-recovery.js"></script>
    <script src="../../dist/mica-dev/connector-continuity.js"></script>
    <script src="../../dist/mica-dev/send-residual-recovery.js"></script>
    <script src="../../dist/mica-dev/content.js"></script>
  </body>
</html>
