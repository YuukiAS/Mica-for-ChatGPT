<!doctype html>
<html lang="en" data-mica-fixture="true">
  <head>
    <meta charset="utf-8">
    <title>Mica Markdown copy fixture</title>
  </head>
  <body>
    <pre id="copy-result">Idle</pre>
    <main>
      <article id="answer" data-testid="conversation-turn-1">
        <div data-message-author-role="assistant" class="markdown">
          <h2>Result</h2>
          <p>Plain prose with <strong>bold</strong>, <em>emphasis</em>, <code>a`b</code>, <a href="https://example.com/a)b">a link</a>, price $5, and inline <span class="math-inline" data-latex="a^2+b^2=c^2"><span aria-hidden="true">visual</span></span>.</p>
          <ul>
            <li>first</li>
            <li>second
              <ol>
                <li>nested</li>
              </ol>
            </li>
          </ul>
          <blockquote><p>quoted line</p></blockquote>
          <pre><code class="language-js">const price = "$5";
console.log(price);</code></pre>
          <table>
            <thead><tr><th>Name</th><th>Value</th></tr></thead>
            <tbody><tr><td>alpha</td><td>1</td></tr></tbody>
          </table>
          <div class="katex-display">
            <span aria-hidden="true">visual duplicate</span>
            <math><semantics><mrow></mrow><annotation encoding="application/x-tex">\begin{aligned} x&=1\\ y&=2 \end{aligned}</annotation></semantics></math>
          </div>
          <div class="math-display">\[\begin{cases}x&=1\\y&=2\end{cases}\]</div>
          <div role="toolbar" data-testid="message-actions">
            <button type="button" aria-label="Copy">Native Copy</button>
            <button type="button" aria-label="Regenerate">Regenerate</button>
          </div>
        </div>
      </article>
    </main>
    <script src="../../dist/mica-dev/markdown-copy.js"></script>
    <script>
      const expected = [
        "## Result",
        "",
        "Plain prose with **bold**, *emphasis*, " + "``a`b``" + ", [a link](https://example.com/a%29b), price $5, and inline $a^2+b^2=c^2$.",
        "",
        "- first",
        "- second",
        "  1. nested",
        "",
        "> quoted line",
        "",
        "```js",
        "const price = \"$5\";",
        "console.log(price);",
        "```",
        "",
        "| Name | Value |",
        "| --- | --- |",
        "| alpha | 1 |",
        "",
        "$$",
        "\\begin{aligned} x&=1\\\\ y&=2 \\end{aligned}",
        "$$",
        "",
        "$$",
        "\\begin{cases}x&=1\\\\y&=2\\end{cases}",
        "$$",
        ""
      ].join("\n");

      const resultNode = document.getElementById("copy-result");
      try {
        const answer = document.getElementById("answer");
        const copied = [];
        Object.defineProperty(navigator, "clipboard", {
          configurable: true,
          value: { writeText: async (value) => { copied.push(value); } }
        });
        window.MicaMarkdownCopy.sync([answer]);
        window.MicaMarkdownCopy.sync([answer]);
        const micaButton = answer.querySelector("[data-mica-copy-action='true']");
        const nativeCopy = answer.querySelector("[aria-label='Copy']:not([data-mica-copy-action])");
        const actionBar = answer.querySelector("[role='toolbar']");
        const firstAction = actionBar?.querySelector("button, [role='button']");
        const actual = window.MicaMarkdownCopy.serializeTurn(answer);
        const beforeClickWidth = micaButton?.getBoundingClientRect?.().width || 0;
        micaButton?.click();
        setTimeout(() => {
          try {
            const afterClickWidth = micaButton?.getBoundingClientRect?.().width || 0;
            const checks = [
              ["golden string", actual === expected],
              ["display math uses dollars", actual.includes("$$\n\\begin{aligned}") && !actual.includes("\\[")],
              ["inline math uses single dollars", actual.includes("$a^2+b^2=c^2$")],
              ["code preserves dollars", actual.includes('const price = "$5";')],
              ["math not duplicated", (actual.match(/\\begin\{aligned\}/g) || []).length === 1],
              ["ui button excluded", !actual.includes("Native Copy") && !actual.includes("Mica Copy")],
              ["mica copy icon only", micaButton instanceof HTMLButtonElement && micaButton.textContent.trim() === "" && !!micaButton.querySelector("svg")],
              ["mica copy accessible label", micaButton?.getAttribute("aria-label") === "Copied as Markdown with Mica" && micaButton?.getAttribute("title") === "Copied as Markdown"],
              ["mica copy before native copy", firstAction === micaButton && nativeCopy instanceof HTMLButtonElement],
              ["native copy preserved", nativeCopy instanceof HTMLButtonElement && nativeCopy.textContent === "Native Copy"],
              ["no duplicate after sync", answer.querySelectorAll("[data-mica-copy-action='true']").length === 1],
              ["success width stable", Math.abs(afterClickWidth - beforeClickWidth) <= 1],
              ["clipboard received markdown", copied[0] === expected]
            ].map(([name, passed]) => ({ name, passed }));
            resultNode.textContent = JSON.stringify({
              passed: checks.every((check) => check.passed),
              checks,
              actual,
              expected,
              ui: {
                buttonText: micaButton?.textContent || "",
                ariaLabel: micaButton?.getAttribute("aria-label") || "",
                title: micaButton?.getAttribute("title") || "",
                svg: !!micaButton?.querySelector("svg"),
                order: Array.from(actionBar?.querySelectorAll("button") || []).map((button) => button.getAttribute("aria-label") || button.textContent || ""),
                duplicateCount: answer.querySelectorAll("[data-mica-copy-action='true']").length,
                nativeCopyPreserved: nativeCopy instanceof HTMLButtonElement,
                widthStable: Math.abs(afterClickWidth - beforeClickWidth) <= 1
              }
            }, null, 2);
          } catch (error) {
            resultNode.textContent = JSON.stringify({ passed: false, error: String(error?.stack || error), actual, expected }, null, 2);
          }
        }, 40);
      } catch (error) {
        resultNode.textContent = JSON.stringify({ passed: false, error: String(error?.stack || error) }, null, 2);
      }
    </script>
  </body>
</html>
