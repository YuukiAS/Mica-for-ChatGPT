<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mica Low Memory lifecycle host</title>
  </head>
  <body>
    <main>
      <section data-testid="conversation-turn-visible-user">
        <article data-message-author-role="user"><div data-message-content>Visible user turn</div></article>
      </section>
      <section data-testid="conversation-turn-visible-assistant">
        <article data-message-author-role="assistant"><div class="markdown">Visible settled assistant turn</div></article>
      </section>
    </main>
    <form><div id="prompt-textarea" role="textbox" contenteditable="true"></div></form>
    <script>
      (() => {
        const conversation = makeConversation(120, 256);
        const encoded = JSON.stringify(encodeTurbo({ loaderData: { route: { serverResponse: { data: conversation } } } }));
        let delivered = encoded;
        globalThis.__reactRouterContext = {};
        globalThis.__reactRouterContext.streamController = { enqueue(chunk) { delivered = chunk; } };
        globalThis.__reactRouterContext.streamController.enqueue(encoded);
        const decoded = decodeTurbo(JSON.parse(delivered));
        const mapping = decoded.loaderData.route.serverResponse.data.mapping;
        globalThis.__MICA_LOW_MEMORY_HOST__ = Object.freeze({
          originalMappingNodes: Object.keys(conversation.mapping).length,
          mappingNodes: Object.keys(mapping).length,
          retainedTurnIds: Object.keys(mapping).filter((id) => mapping[id]?.message),
        });

        function makeConversation(count, size) {
          const mapping = { root: { id: "root", children: [] } };
          let parent = "root";
          for (let index = 1; index <= count; index += 1) {
            const id = `turn-${index}`;
            mapping[parent].children.push(id);
            mapping[id] = {
              id,
              parent,
              children: [],
              message: {
                author: { role: index % 2 ? "user" : "assistant" },
                content: { content_type: "text", parts: [`${index}:` + "x".repeat(Math.max(1, size - String(index).length - 1))] },
                metadata: {},
              },
            };
            parent = id;
          }
          return { mapping, current_node: parent, root: "root" };
        }

        function encodeTurbo(value) {
          const flat = [];
          const seen = new Map();
          const keys = new Map();
          encode(value, 0);
          return flat;
          function encode(item, forced = null) {
            if (typeof item === "string") return encodeString(item, false);
            if (item && typeof item === "object" && seen.has(item)) return seen.get(item);
            const index = forced == null ? flat.length : forced;
            if (forced == null) flat.push(null);
            else while (flat.length <= forced) flat.push(null);
            if (item && typeof item === "object") seen.set(item, index);
            if (Array.isArray(item)) flat[index] = item.map((entry) => encode(entry));
            else if (item && typeof item === "object") {
              const object = {};
              flat[index] = object;
              for (const [key, entry] of Object.entries(item)) object[`_${encodeString(key, true)}`] = encode(entry);
            } else flat[index] = item;
            return index;
          }
          function encodeString(value, key) {
            if (key && keys.has(value)) return keys.get(value);
            const index = flat.length;
            flat.push(value);
            if (key) keys.set(value, index);
            return index;
          }
        }

        function decodeTurbo(flat) {
          const cache = new Map();
          return decode(0);
          function decode(index) {
            if (cache.has(index)) return cache.get(index);
            const value = flat[index];
            if (Array.isArray(value)) {
              const array = [];
              cache.set(index, array);
              for (const item of value) array.push(Number.isInteger(item) && item >= 0 ? decode(item) : item);
              return array;
            }
            if (value && typeof value === "object") {
              const object = {};
              cache.set(index, object);
              for (const [key, item] of Object.entries(value)) object[flat[Number(key.slice(1))]] = Number.isInteger(item) && item >= 0 ? decode(item) : item;
              return object;
            }
            return value;
          }
        }
      })();
    </script>
  </body>
</html>
