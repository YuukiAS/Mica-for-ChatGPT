      * {
        box-sizing: border-box;
      }

      body {
        min-height: 1800px;
        margin: 0;
        background: #f7f7f8;
        color: #171717;
        font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(840px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 24px 0 180px;
      }

      article {
        margin: 14px 0;
        padding: 14px;
        border: 1px solid #d9d9e3;
        border-radius: 8px;
        background: #ffffff;
      }

      .composer {
        position: fixed;
        left: 50%;
        bottom: 14px;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        width: min(820px, calc(100vw - 24px));
        min-height: 82px;
        padding: 12px;
        border: 1px solid #cfcfd6;
        border-radius: 18px;
        background: #ffffff;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.16);
        transform: translateX(-50%);
      }

      [role="textbox"] {
        min-height: 46px;
        padding: 10px 12px;
        border: 1px solid #dddddd;
        border-radius: 12px;
        white-space: pre-wrap;
      }

      .mention-chip {
        display: inline-flex;
        padding: 2px 6px;
        border-radius: 999px;
        background: #e5e7eb;
      }

      #guided-result {
        position: fixed;
        left: 8px;
        top: 8px;
        z-index: 1;
        max-width: 48vw;
        white-space: pre-wrap;
        font-size: 11px;
      }
    </style>

          ["fingerprint mismatch expires waiting phase", recoveryMismatchTimeoutReport.staleRecovery?.fingerprintMatched === false && recoveryMismatchTimeoutReport.staleRecovery?.attempted === false && recoveryMismatchTimeoutReport.staleRecovery?.expired === true],
          ["old generation timer cannot expire new generation", recoveryOldGenerationTimerReport.staleRecovery?.generationId >= 2 && recoveryOldGenerationTimerReport.staleRecovery?.attempted === true && recoveryOldGenerationTimerReport.staleRecovery?.succeeded === true && recoveryOldGenerationTimerReport.summary.finalTextLength === 0],
          ["recovery waits for settled stale payload", recoverySettledPayloadReport.staleRecovery?.attempted === true && recoverySettledPayloadReport.staleRecovery?.succeeded === true && recoverySettledPayloadReport.staleRecovery?.preClearOldLength === 8 && recoverySettledPayloadReport.summary.finalTextLength === 0],
          ["recovery cancels on new user input", recoveryNewInputReport.staleRecovery?.cancelledByUserInput === true && recoveryNewInputReport.staleRecovery?.attempted === false && recoveryNewInputReport.summary.finalTextLength === 11],
          ["pending confirmation cancels on new user input", recoveryPendingCancelledByInputReport.staleRecovery?.fullClearIntentObserved === true && recoveryPendingCancelledByInputReport.staleRecovery?.clearConfirmed === false && recoveryPendingCancelledByInputReport.staleRecovery?.cancelledByUserInput === true && recoveryPendingCancelledByInputReport.staleRecovery?.attempted === false && recoveryPendingCancelledByInputReport.summary.finalTextLength === 11],
          ["recovery does not delete fingerprint mismatch", recoveryMismatchReport.staleRecovery?.attempted === false && recoveryMismatchReport.summary.finalTextLength === 11],
          ["recovery does not run on empty remount", recoveryEmptyRemountReport.staleRecovery?.attempted === false && recoveryEmptyRemountReport.summary.finalTextLength === 0],
          ["recovery attempts are bounded", recoveryRepeatedRemountReport.staleRecovery?.attemptCount <= 3 && recoveryRepeatedRemountReport.events.filter((event) => event.type === "stale_recovery_attempt").length <= 3],
          ["persistent multi-remount stale payload is cleared stably", recoveryPersistentMultiRemountReport.staleRecovery?.attemptCount >= 2 && recoveryPersistentMultiRemountReport.staleRecovery?.localClearObserved === true && recoveryPersistentMultiRemountReport.staleRecovery?.sameStalePayloadReappeared === true && recoveryPersistentMultiRemountReport.staleRecovery?.finalClearStable === true && recoveryPersistentMultiRemountReport.summary.finalTextLength === 0],
          ["tombstone cancels after new user input following recovery", recoveryTombstoneCancelAfterAttemptReport.staleRecovery?.cancelledByUserInput === true && recoveryTombstoneCancelAfterAttemptReport.staleRecovery?.attemptCount === 1 && recoveryTombstoneCancelAfterAttemptReport.summary.finalTextLength === 11],
          ["tombstone does not delete different later fingerprint", recoveryTombstoneMismatchAfterAttemptReport.staleRecovery?.attemptCount === 1 && recoveryTombstoneMismatchAfterAttemptReport.staleRecovery?.sameStalePayloadReappeared === false && recoveryTombstoneMismatchAfterAttemptReport.summary.finalTextLength === 9],
          ["tombstone attempts exhaust without looping", recoveryAttemptsExhaustedReport.staleRecovery?.attemptsExhausted === true && recoveryAttemptsExhaustedReport.staleRecovery?.attemptCount === 3 && recoveryAttemptsExhaustedReport.summary.finalTextLength === 7],
          ["recovery can arm again after expiration", recoveryRearmAfterExpiredReport.staleRecovery?.generationId >= 2 && recoveryRearmAfterExpiredReport.staleRecovery?.attempted === true && recoveryRearmAfterExpiredReport.staleRecovery?.succeeded === true && recoveryRearmAfterExpiredReport.summary.finalTextLength === 0],
          ["early ordinary delete does not consume full-clear guard", recoveryEarlyDeleteThenFullClearReport.staleRecovery?.preClearOldLength === 9 && recoveryEarlyDeleteThenFullClearReport.staleRecovery?.attempted === true && recoveryEarlyDeleteThenFullClearReport.staleRecovery?.succeeded === true && recoveryEarlyDeleteThenFullClearReport.summary.finalTextLength === 0],
          ["full-selection cut arms recovery", recoveryCutReport.staleRecovery?.fullClearIntentType === "selection_cut" && recoveryCutReport.staleRecovery?.preClearOldLength === 8 && recoveryCutReport.staleRecovery?.attempted === true && recoveryCutReport.staleRecovery?.succeeded === true],
          ["stale clear recovery feature toggle disables recovery only", recoveryFeatureDisabledReport.runtime.micaEnabled === true && recoveryFeatureDisabledReport.staleRecovery?.enabled === false && recoveryFeatureDisabledReport.staleRecovery?.attempted === false && recoveryFeatureDisabledReport.summary.finalTextLength === 11],
          ["mica disabled recovery does not start", recoveryDisabledReport.staleRecovery?.enabled === false && recoveryDisabledReport.staleRecovery?.attempted === false && recoveryDisabledReport.summary.finalTextLength === 12],
          ["mica off diagnostics capture works", micaOffReport.runtime.micaEnabled === false && micaOffReport.events.length > 0],
          ["mica off keeps runtime disabled", micaOffReport.runtime.nativeSafeMode === true && micaOffReport.runtime.documentMutationObserverActive === false && micaOffReport.runtime.composerLifecycleListenersAttached === false && micaOffReport.runtime.optimizedTurns === 0 && micaOffReport.staleRecovery?.enabled === false],
          ["bounded events present", nativeLikeReport.session.eventLimit === 180 && nativeLikeReport.events.length <= 180],
          ["session listeners stopped", samplerAfter && samplerAfter.samplerActive === false && samplerAfter.listenersActive === false],
          ["report says no prompt text", nativeLikeReport.privacy.promptTextIncluded === false],
          ["report says no answer text", nativeLikeReport.privacy.answerTextIncluded === false],
          ["report says no raw DOM", nativeLikeReport.privacy.rawDomIncluded === false],
          ["report excludes fixture draft text", !reportText.includes("stable ten") && !reportText.includes("stale draft one") && !reportText.includes("stale draft two") && !reportText.includes("manual send draft") && !reportText.includes("clearable draft") && !reportText.includes("single x") && !reportText.includes("delay old") && !reportText.includes("blur old") && !reportText.includes("focus old") && !reportText.includes("plain old") && !reportText.includes("other old") && !reportText.includes("vanish old") && !reportText.includes("old text") && !reportText.includes("native0x") && !reportText.includes("pretext8") && !reportText.includes("scopeold") && !reportText.includes("race old") && !reportText.includes("type old") && !reportText.includes("miss old") && !reportText.includes("different") && !reportText.includes("first gen") && !reportText.includes("next gen") && !reportText.includes("full old") && !reportText.includes("fresh input") && !reportText.includes("pending old") && !reportText.includes("new payload") && !reportText.includes("loop old") && !reportText.includes("oldloop8") && !reportText.includes("keep old") && !reportText.includes("same old") && !reportText.includes("other new") && !reportText.includes("max old") && !reportText.includes("first old") && !reportText.includes("second old") && !reportText.includes("early old") && !reportText.includes("cut text") && !reportText.includes("feature off") && !reportText.includes("disabled old") && !reportText.includes("off mode")]
        ].map(([name, passed]) => ({ name, passed: !!passed }));

        resultNode.textContent = JSON.stringify({
          passed: checks.every((check) => check.passed),
          checks,
          caseSummaries: {
            recoverySamePayload: summarizeCase(recoverySamePayloadReport),
            recoverySettledPayload: summarizeCase(recoverySettledPayloadReport),
            recoveryNewInput: summarizeCase(recoveryNewInputReport),
            recoveryMismatch: summarizeCase(recoveryMismatchReport),
            recoveryEmptyRemount: summarizeCase(recoveryEmptyRemountReport),
            recoveryRepeatedRemount: summarizeCase(recoveryRepeatedRemountReport),
            recoveryPersistentMultiRemount: summarizeCase(recoveryPersistentMultiRemountReport),
            recoveryTombstoneCancelAfterAttempt: summarizeCase(recoveryTombstoneCancelAfterAttemptReport),
            recoveryTombstoneMismatchAfterAttempt: summarizeCase(recoveryTombstoneMismatchAfterAttemptReport),
            recoveryAttemptsExhausted: summarizeCase(recoveryAttemptsExhaustedReport),
            recoverySingleBackspace: summarizeCase(recoverySingleBackspaceReport),
            recoveryDelayedConfirmation: summarizeCase(recoveryDelayedConfirmationReport),
            recoveryBlurConfirmation: summarizeCase(recoveryBlurConfirmationReport),
            recoveryFocusoutConfirmation: summarizeCase(recoveryFocusoutConfirmationReport),
            recoveryOrdinaryBlur: summarizeCase(recoveryOrdinaryBlurReport),
            recoveryUnrelatedBlur: summarizeCase(recoveryUnrelatedBlurReport),
            recoveryDirectUnmountNoConfirmation: summarizeCase(recoveryDirectUnmountNoConfirmationReport),
            recoveryLateSettlingExpiryRace: summarizeCase(recoveryLateSettlingExpiryRaceReport),
            recoveryNativeStayedEmpty: summarizeCase(recoveryNativeStayedEmptyReport),
            recoveryGenerationScopedPreClear: summarizeCase(recoveryGenerationScopedPreClearReport),
            recoverySettlingNewInput: summarizeCase(recoverySettlingNewInputReport),
            recoveryMismatchTimeout: summarizeCase(recoveryMismatchTimeoutReport),
            recoveryOldGenerationTimer: summarizeCase(recoveryOldGenerationTimerReport),
            recoveryRearmAfterExpired: summarizeCase(recoveryRearmAfterExpiredReport),
            recoveryEarlyDeleteThenFullClear: summarizeCase(recoveryEarlyDeleteThenFullClearReport),
            recoveryPendingCancelledByInput: summarizeCase(recoveryPendingCancelledByInputReport),
            recoveryCut: summarizeCase(recoveryCutReport),
            recoveryFeatureDisabled: summarizeCase(recoveryFeatureDisabledReport),
            recoveryDisabled: summarizeCase(recoveryDisabledReport),
            micaOff: summarizeCase(micaOffReport)
          },
          delayedReport,
          guidedReport: nativeLikeReport,
          cases: {
            remountWithTextReport,
            nativeLikeReport,
            restoredAfterPresentZeroReport,
            restoredAfterDeleteClearReport,
            staleAfterUserTurnReport,
            cleanDeleteReport,
            recoverySingleBackspaceReport,
            recoveryDelayedConfirmationReport,
            recoveryBlurConfirmationReport,
            recoveryFocusoutConfirmationReport,
            recoveryOrdinaryBlurReport,
            recoveryUnrelatedBlurReport,
            recoveryDirectUnmountNoConfirmationReport,
            recoverySamePayloadReport,
            recoveryNativeStayedEmptyReport,
            recoveryGenerationScopedPreClearReport,
            recoveryLateSettlingExpiryRaceReport,
            recoverySettlingNewInputReport,
            recoveryMismatchTimeoutReport,
            recoveryOldGenerationTimerReport,
            recoverySettledPayloadReport,
            recoveryNewInputReport,
            recoveryPendingCancelledByInputReport,
            recoveryMismatchReport,
            recoveryEmptyRemountReport,
            recoveryRepeatedRemountReport,
            recoveryPersistentMultiRemountReport,
            recoveryTombstoneCancelAfterAttemptReport,
            recoveryTombstoneMismatchAfterAttemptReport,
            recoveryAttemptsExhaustedReport,
            recoveryRearmAfterExpiredReport,
            recoveryEarlyDeleteThenFullClearReport,
            recoveryCutReport,
            recoveryFeatureDisabledReport,
            recoveryDisabledReport,
            micaOffReport
          }
        }, null, 2);
      }

      function summarizeCase(report) {
        return {
          classification: report?.summary?.classification || null,
          finalTextLength: report?.summary?.finalTextLength ?? null,
          currentClearGeneration: report?.currentClearGeneration || null,
          staleRecovery: report?.staleRecovery || null,
          recoveryEvents: (report?.events || [])
            .filter((event) => event.type.startsWith("stale_recovery_"))
            .map((event) => ({
              type: event.type,
              oldLength: event.oldLength,
              newLength: event.newLength,
              fingerprintMatched: event.fingerprintMatched,
              attemptCount: event.attemptCount,
              reason: event.reason || null
            }))
        };
      }

      let captureCaseCounter = 0;

      async function captureCase(action) {
        const caseId = ++captureCaseCounter;
        resultNode.textContent = `Running captureCase ${caseId}`;
        unmountComposer();
        await delay(60);
        window.__MICA_TEST_CONTROLS__.startComposerGuidedDiagnostics();
        try {
          await delay(260);
          await action();
          await delay(260);
          return window.__MICA_TEST_CONTROLS__.getComposerGuidedDiagnosticsReport();
        } catch (error) {
          throw new Error(`captureCase ${caseId}: ${error?.message || String(error)}`);
        } finally {
          window.__MICA_TEST_CONTROLS__.stopComposerGuidedDiagnostics();
          await delay(60);
        }
      }

      function appendTurns(start, count) {
        for (let index = start; index < start + count; index += 1) {
          appendTurn(index, index % 2 === 0 ? "assistant" : "user", `Mounted turn ${index}`);
        }
      }

      function appendTurn(index, role, body) {
        const article = document.createElement("article");
        article.dataset.testid = `conversation-turn-${index}`;
        const marker = document.createElement("div");
        marker.dataset.messageAuthorRole = role;
        marker.textContent = `${role} turn ${index}`;
        const paragraph = document.createElement("p");
        paragraph.textContent = body;
        article.append(marker, paragraph);
        conversation.appendChild(article);
        return article;
      }

      function mountComposer(text) {
        unmountComposer();
        const form = document.createElement("form");
        form.className = "composer";
        form.dataset.testid = "composer";
        form.dataset.serial = String(++composerSerial);
        form.setAttribute("aria-label", "Message composer");
        form.innerHTML = `
          <div id="editor" role="textbox" contenteditable="plaintext-only" aria-label="Message Mica"></div>
          <button type="submit" data-testid="send-button" aria-label="Send message">Send</button>
        `;
        dock.appendChild(form);
        composer = form;
        editor = form.querySelector("[role='textbox']");
        setEditorText(text);
        editor.focus();
      }

      function unmountComposer() {
        if (!composer) return;
        composer.remove();
        composer = null;
        editor = null;
      }

      function setEditorText(value) {
        if (!editor) return;
        editor.textContent = value;
      }

      function setMentionLikeComposer() {
        if (!editor) return;
        editor.textContent = "";
        const chip = document.createElement("span");
        chip.className = "mention-chip";
        chip.dataset.mention = "GitHub";
        chip.setAttribute("aria-label", "GitHub connector");
        chip.textContent = "@GitHub";
        editor.appendChild(chip);
      }

      async function dispatchDeleteClear() {
        editor.focus();
        editor.dispatchEvent(new InputEvent("beforeinput", { bubbles: true, cancelable: true, inputType: "deleteByCut", data: null }));
        setEditorText("");
        editor.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "deleteByCut", data: null }));
        await delay(220);
      }

      async function dispatchSingleBackspace() {
        editor.focus();
        collapseSelectionAtEnd();
        editor.dispatchEvent(new KeyboardEvent("keydown", { bubbles: true, cancelable: true, key: "Backspace" }));
        editor.dispatchEvent(new InputEvent("beforeinput", { bubbles: true, cancelable: true, inputType: "deleteContentBackward", data: null }));
        setEditorText((editor.textContent || "").slice(0, -1));
        editor.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "deleteContentBackward", data: null }));
        await delay(220);
      }

      async function dispatchFullClearDelete(key) {
        editor.focus();
        editor.dispatchEvent(new KeyboardEvent("keydown", { bubbles: true, cancelable: true, key: "a", ctrlKey: true }));
        selectAllEditor();
        editor.dispatchEvent(new KeyboardEvent("keydown", { bubbles: true, cancelable: true, key }));
        const inputType = key === "Backspace" ? "deleteContentBackward" : "deleteContentForward";
        editor.dispatchEvent(new InputEvent("beforeinput", { bubbles: true, cancelable: true, inputType, data: null }));
        setEditorText("");
        editor.dispatchEvent(new InputEvent("input", { bubbles: true, inputType, data: null }));
        await delay(220);
      }

      async function dispatchFullClearIntentOnly(key) {
        editor.focus();
        editor.dispatchEvent(new KeyboardEvent("keydown", { bubbles: true, cancelable: true, key: "a", ctrlKey: true }));
        selectAllEditor();
        editor.dispatchEvent(new KeyboardEvent("keydown", { bubbles: true, cancelable: true, key }));
        const inputType = key === "Backspace" ? "deleteContentBackward" : "deleteContentForward";
        editor.dispatchEvent(new InputEvent("beforeinput", { bubbles: true, cancelable: true, inputType, data: null }));
      }

      async function dispatchFullSelectionCut() {
        editor.focus();
        selectAllEditor();
        editor.dispatchEvent(new ClipboardEvent("cut", { bubbles: true, cancelable: true }));
        setEditorText("");
        editor.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "deleteByCut", data: null }));
        await delay(220);
      }

      function dispatchEditorBlur() {
        editor.dispatchEvent(new FocusEvent("blur", { bubbles: false, cancelable: false }));
      }

      function dispatchEditorFocusout() {
        editor.dispatchEvent(new FocusEvent("focusout", { bubbles: true, cancelable: false }));
      }

      function dispatchUnrelatedBlur() {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = "other";
        document.body.appendChild(button);
        button.dispatchEvent(new FocusEvent("blur", { bubbles: false, cancelable: false }));
        button.remove();
      }

      function selectAllEditor() {
        const selection = getSelection();
        const range = document.createRange();
        range.selectNodeContents(editor);
        selection.removeAllRanges();
        selection.addRange(range);
      }

      function collapseSelectionAtEnd() {
        const selection = getSelection();
        const range = document.createRange();
        range.selectNodeContents(editor);
        range.collapse(false);
        selection.removeAllRanges();
        selection.addRange(range);
      }

      async function dispatchUserInsert(value) {
        editor.focus();
        editor.dispatchEvent(new InputEvent("beforeinput", { bubbles: true, cancelable: true, inputType: "insertText", data: "x" }));
        setEditorText(value);
        editor.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "insertText", data: "x" }));
        await delay(220);
      }

      function getEditorLength() {
        return (editor?.textContent ?? editor?.innerText ?? "").length;
      }

      function waitForEditorLength(length, timeout) {
        return waitFor(() => editor && getEditorLength() === length, timeout, () => `editor length ${getEditorLength()}`);
      }

      function waitForRecoverySucceeded(timeout) {
        return waitFor(() => {
          const state = window.__MICA_TEST_CONTROLS__.getStaleComposerRecoveryState();
          return state?.succeeded === true && editor && getEditorLength() === 0;
        }, timeout, () => JSON.stringify(window.__MICA_TEST_CONTROLS__.getStaleComposerRecoveryState()));
      }

      function waitForFinalClearStable(timeout) {
        return waitFor(() => {
          const state = window.__MICA_TEST_CONTROLS__.getStaleComposerRecoveryState();
          return state?.finalClearStable === true && editor && getEditorLength() === 0;
        }, timeout, () => JSON.stringify(window.__MICA_TEST_CONTROLS__.getStaleComposerRecoveryState()));
      }

      function waitForGuardAge(ageMs, timeout) {
        return waitFor(() => {
          const state = window.__MICA_TEST_CONTROLS__.getStaleComposerRecoveryState();
          return state?.armed === true && state?.clearAnchorElapsedMs >= ageMs;
        }, timeout, () => JSON.stringify(window.__MICA_TEST_CONTROLS__.getStaleComposerRecoveryState()));
      }

      function waitForClearConfirmed(timeout) {
        return waitFor(() => {
          const state = window.__MICA_TEST_CONTROLS__.getStaleComposerRecoveryState();
          return state?.clearConfirmed === true;
        }, timeout, () => JSON.stringify(window.__MICA_TEST_CONTROLS__.getStaleComposerRecoveryState()));
      }

      function waitFor(fn, timeout, describeTimeout) {
        const started = Date.now();
        return new Promise((resolve, reject) => {
          const timer = setInterval(() => {
            try {
              const value = fn();
              if (value) {
                clearInterval(timer);
                resolve(value);
              } else if (Date.now() - started > timeout) {
                clearInterval(timer);
                reject(new Error(describeTimeout ? describeTimeout() : "Timed out"));
              }
            } catch (error) {
              clearInterval(timer);
              reject(error);
            }
          }, 40);
        });
      }

      function delay(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }
